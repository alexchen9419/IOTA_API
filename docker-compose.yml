
services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt_service
    restart: always
    ports:
      - "8883:8883"   # MQTT over TLS（明碼 1883 已關閉）
      # 9001 WebSocket 已於 2026-10-24 移除：明文＋匿名，可繞過 API 直接 unlock
    volumes:
      - ./config:/mosquitto/config
      - ./config/certs:/mosquitto/certs:ro
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    networks:
      - mqtt-net

  mqtt-server:
    build: ./mqtt-server
    container_name: mqtt_server
    restart: always
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=8883
      - MQTT_USE_TLS=1
      - MQTT_CA_CERT=/certs/ca.crt
    ports:
      - "8080:8080"   # OTA 韌體檔案下載（/firmware/<file>.bin）
    volumes:
      - ./mqtt-server:/app   # 掛整個目錄：改 code 後 restart 生效，devices.json 保留在本機
      - ./config/certs:/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - mqtt-net

  # 網頁監控（web_monitor.py）跟 mqtt-server 同一個 image、只是換 command。
  # 拆成獨立服務而不是用 docker exec 另外跑，是因為 exec 起的程序不是容器主程序，
  # mqtt-server 一 restart 就會被殺掉，監控頁面就打不開了。
  mqtt-monitor:
    build: ./mqtt-server
    container_name: mqtt_monitor
    restart: always
    command: ["python", "-u", "web_monitor.py"]
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=8883
      - MQTT_USE_TLS=1
      - MQTT_CA_CERT=/certs/ca.crt
    ports:
      - "8090:8090"   # 網頁監控頁面
    volumes:
      - ./mqtt-server:/app
      - ./config/certs:/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - mqtt-net

  node-red:
    image: nodered/node-red:latest
    container_name: node_red
    restart: always
    ports:
      - "127.0.0.1:1880:1880"   # Node-RED 編輯器：只綁本機（區網其他裝置不需要連它；要遠端用 SSH 轉發）
    volumes:
      - ./node-red-data:/data
    environment:
      - TZ=Asia/Taipei
      # 編輯器登入密碼（settings.js 的 adminAuth 讀這個；帳號 admin）
      - NODE_RED_ADMIN_PASSWORD=${NODE_RED_ADMIN_PASSWORD:?Set NODE_RED_ADMIN_PASSWORD in .env (>= 16 chars)}
    depends_on:
      - mqtt-broker
    networks:
      - mqtt-net

  mysql:
    image: mysql:8.0
    container_name: iot_mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=devicemanagement
      - MYSQL_USER=apiuser
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./API/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" -D "$$MYSQL_DATABASE" -Nse "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mqtt-net

  api:
    build: ./API
    container_name: iot_api
    restart: always
    environment:
      - DB_HOST=mysql
      - DB_USER=apiuser
      - DB_PASS=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - DB_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - DB_NAME=devicemanagement
      - CONTROL_MODE=mqtt
      # 瀏覽器 CORS 來源白名單（逗號分隔，例如 https://app.example.com）。localhost / 127.0.0.1 任意 port 預設允許（Flutter Web 開發用）
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # /report_security_anomaly 的服務金鑰（呼叫端要帶 X-Service-Token）；>= 32 字元
      - ANOMALY_SERVICE_TOKEN=${ANOMALY_SERVICE_TOKEN:?Set ANOMALY_SERVICE_TOKEN in .env (>= 32 chars)}
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=8883
      - MQTT_USE_TLS=1
      - MQTT_CA_CERT=/certs/ca.crt
      - OTA_HOST=192.168.1.3   # ESP32 直接連這個位址下載 .bin，要跟 Arduino sketch 的 MQTT_BROKER 同一台機器（見 API/ota_update）
      # 訪客 QR 的網址（訪客手機要打得開）。留空 = 用 App 連 API 的 host，只限同區網；對外請填 HTTPS 網址
      - GUEST_QR_BASE_URL=${GUEST_QR_BASE_URL:-}
      - PYTHONPATH=/app   # 讓各 CGI 子行程（cwd 是自己的子目錄）也 import 得到 /app/mqtt_tls.py
    ports:
      - "8091:8000"   # 家庭/裝置管理 API（見 API/gateway.py 的路由列表）
    volumes:
      - ./API:/app
      - ./config/certs:/certs:ro
      # /ota_update 觸發前要檢查韌體與簽章：韌體目錄 + OTA「公鑰」，唯讀。
      # 只掛公鑰檔，不要掛整個 ota_keys/（那裡有簽章私鑰）。
      - ./mqtt-server/firmware:/firmware:ro
      - ./mqtt-server/ota_keys/ota_public_key.h:/ota/ota_public_key.h:ro
    depends_on:
      mysql:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    networks:
      - mqtt-net

  api-mqtt-bridge:
    build: ./API
    container_name: iot_api_mqtt_bridge
    restart: always
    command: ["python", "-u", "control_device/mqtt_topic_bridge.py"]
    environment:
      - DB_HOST=mysql
      - DB_USER=apiuser
      - DB_PASS=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - DB_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - DB_NAME=devicemanagement
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=8883
      - MQTT_USE_TLS=1
      - MQTT_CA_CERT=/certs/ca.crt
      - PYTHONPATH=/app
    volumes:
      - ./API:/app
      - ./config/certs:/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    networks:
      - mqtt-net

  # 警報路由：訂閱 home/security/+/alert（api-mqtt-bridge 把門鈴/防拆事件轉發到這裡），
  # 記錄 UC4.4 異常、推給家庭成員的 app/user/<id>/notifications，再推 Telegram / ntfy。
  # 推播金鑰從主機環境變數或 repo 根目錄的 .env 帶入（不要 commit），沒設就只走 MQTT。
  alert-service:
    build: ./API
    container_name: iot_alert_service
    restart: always
    command: ["python", "-u", "alert_service/alert_service.py"]
    environment:
      - DB_HOST=mysql
      - DB_USER=apiuser
      - DB_PASS=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - DB_NAME=devicemanagement
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=8883
      - MQTT_USE_TLS=1
      - MQTT_CA_CERT=/certs/ca.crt
      - PYTHONPATH=/app
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
    volumes:
      - ./API:/app
      - ./config/certs:/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    networks:
      - mqtt-net

networks:
  mqtt-net:
    driver: bridge