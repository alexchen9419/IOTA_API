# TLS-only：只開 8883，明碼的 1883 已經關掉。
# 憑證由 config/certs/generate_certs.sh 產生，掛進容器的 /mosquitto/certs/。
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# WebSocket 監聽器（9001）已移除 —— 2026-10-24
# 原因：明文 + allow_anonymous，同區網任何人連 ws://<host>:9001 就能 publish
#   home/device/<mac>/cmd {"action":"unlock"}
# 完全繞過 TLS、control_device 的權限檢查與稽核。正式環境沒有客戶端使用 9001。
# 開發觀測台若需要 WebSocket，請改用 mosquitto.dev.conf（僅本機開發）。
#
# ⚠️ 仍未修：8883 同樣是 allow_anonymous true —— TLS 只加密傳輸，不驗身分。
#    待補 password_file + acl_file，並同步更新 API／mqtt-server／Node-RED 與 Arduino 韌體。

# 開發階段允許匿名登入 (不需帳號密碼)；TLS 只保證傳輸加密，不做身分驗證，兩者是分開的層次
allow_anonymous true

# 資料持久化設定
persistence true
persistence_location /mosquitto/data/

# 日誌設定
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout