# TLS-only：只開 8883，明碼的 1883 已經關掉。
# 憑證由 config/certs/generate_certs.sh 產生，掛進容器的 /mosquitto/certs/。
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# WebSocket 監聽器（9001）已移除 —— 2026-10-24
# 原因：明文 + allow_anonymous，同區網任何人連 ws://<host>:9001 就能 publish
#   home/device/<mac>/cmd {"action":"unlock"}
# 完全繞過 TLS、control_device 的權限檢查與稽核。正式環境沒有客戶端使用 9001。
# 開發觀測台若需要 WebSocket，請改用 mosquitto.dev.conf（僅本機開發）。
#
# 已關閉匿名 —— 帳號密碼 + ACL（config/passwd、config/acl，角色與權限見 acl）。
# TLS 只加密傳輸，身分驗證靠下面這兩個檔案；兩者是分開的層次。
# passwd 不進版控，產生方式見 config/README_mqtt_auth.md。
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# 資料持久化設定
persistence true
persistence_location /mosquitto/data/

# 日誌設定
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout